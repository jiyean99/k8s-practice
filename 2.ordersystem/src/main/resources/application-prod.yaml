spring:
  config:
    active:
      on-profile: prod
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    # ${} : Pod 실행 시점에 k8s의 Secret 자원에서 불러와 주입
    url: jdbc:mariadb://${DB_HOST}:3306/order_system?useSSL=true
    username: admin
    password: ${DB_PW}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  redis:
    host: my-redis
    port: 6379
jwt:
  secretKey: YmV5b25kYWNjZXNzdG9rZW5zZWNyZXRrZXliZXlvbmRhY2Nlc3N0b2tlbnNlY3JldGtleWJleW9uZGFjY2Vzc3Rva2Vuc2VjcmV0a2V5
  expiration: 30
  secretKeyRt: YmV5b25kYWNjZXNzdG9rZW5zZWNyZXRrZXliZXlvbmRhY2Nlc3N0b2tlbnNlY3JldGtleWJleW9uZGFjY2Vzc3Rva2Vuc2VjcmV0a2V5
  expirationRt: 30000

logging:
  level:
    root: info

aws:
  credentials:
    access-key: xxxxxx
    secret-key: xxxxxx
  region: ap-northeast-2
  s3:
    bucket: eazy-order-service-product-img
