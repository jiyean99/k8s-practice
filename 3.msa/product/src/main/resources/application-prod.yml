server:
  port: 8080
eureka:
  client:
    enabled: false
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:3306/order_system_msa?useSSL=true
    username: admin
    password: ${DB_PW}
    hikari:
      maximum-pool-size: 1
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  redis:
    host: redis-service
    port: 6379
  kafka:
    kafka-server: kafka-service:9092
    consumer:
      # 카프카에서 그룹 ID는 컨슈머 그룹을 식별하는 ID로써,동일한 그룹 ID를 가진 컨슈머들은 메시지를 분담하여 consume 한다.
      groud-id: product-group
aws:
  credentials:
    access-key: xxxxxx
    secret-key: xxxxxx
  region: ap-northeast-2
  s3:
    bucket: eazy-order-service-product-img
